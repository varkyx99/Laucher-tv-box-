<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TV Launcher</title>
<style>
:root{--accent:#4f8cff;--panel:#20232b;--panel2:#2c303a;--text:#e8eaf0;--muted:#9aa0ad;--bar:44px}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#000;color:var(--text);font:15px system-ui,"Segoe UI",Roboto,sans-serif;user-select:none;-webkit-user-select:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
#wall{position:fixed;inset:0;background:#111}
#desk{position:fixed;inset:0 0 var(--bar) 0;padding:14px;display:grid;grid-auto-flow:column;grid-template-rows:repeat(auto-fill,104px);grid-auto-columns:96px;gap:6px;align-content:start;justify-content:start}
.ico{background:none;border:0;display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px 4px;border-radius:8px;width:92px;height:100px;cursor:pointer;text-shadow:0 1px 3px #000}
.ico:hover{background:rgba(255,255,255,.13)}
.g{font-size:36px;line-height:44px;height:44px;display:flex;align-items:center;justify-content:center}
.g img{width:40px;height:40px;object-fit:contain}
.ico .n{font-size:13px;text-align:center;line-height:1.2;max-height:2.4em;overflow:hidden;word-break:break-word}
#wins{position:fixed;inset:0 0 var(--bar) 0;pointer-events:none}
.win{position:absolute;pointer-events:auto;display:flex;flex-direction:column;background:var(--panel);border:1px solid #3a3f4b;border-radius:8px;overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.45);min-width:260px;min-height:160px}
.win.max{left:0!important;top:0!important;width:100%!important;height:100%!important;border-radius:0;border:0}
.win.hide{display:none}
.win.act{border-color:var(--accent)}
.tb{display:flex;align-items:center;height:34px;background:var(--panel2);flex:none;touch-action:none}
.ti{padding:0 8px 0 10px}
.tt{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{width:44px;height:34px;border:0;background:none;cursor:pointer}
.tb button:hover{background:rgba(255,255,255,.12)}
.tb button.x:hover{background:#d33}
.bd{flex:1;overflow:auto;position:relative;display:flex;flex-direction:column;min-height:0;user-select:text;-webkit-user-select:text}
.bd iframe{flex:1;width:100%;border:0;background:#fff}
.wt{display:flex;align-items:center;gap:6px;padding:4px 6px;background:var(--panel2);border-top:1px solid #3a3f4b;font-size:12px;color:var(--muted)}
.wt .u{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wt button{background:none;border:0;padding:2px 10px;cursor:pointer;border-radius:4px;font-size:15px}
.wt button:hover{background:rgba(255,255,255,.12)}
.rz{position:absolute;right:0;bottom:0;width:20px;height:20px;cursor:nwse-resize;touch-action:none}
.rz:after{content:"";position:absolute;right:4px;bottom:4px;width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted)}
.win.max .rz{display:none}
body.drag iframe{pointer-events:none}
#bar{position:fixed;left:0;right:0;bottom:0;height:var(--bar);background:rgba(18,20,26,.94);display:flex;align-items:stretch;gap:2px;padding:0 4px;z-index:99999;border-top:1px solid #333845}
#bar button{background:none;border:0;cursor:pointer;padding:0 14px;display:flex;align-items:center;gap:8px;max-width:180px;white-space:nowrap}
#bar button:hover{background:rgba(255,255,255,.1)}
#bar button.on{background:var(--panel2);box-shadow:inset 0 -2px var(--accent)}
#bar button.min{opacity:.55}
#bar .tt2{overflow:hidden;text-overflow:ellipsis}
#startbtn{font-size:20px;color:var(--accent)}
#tasks{display:flex;flex:1;gap:2px;overflow:hidden}
#clock{align-self:center;padding:0 12px;cursor:pointer;font-variant-numeric:tabular-nums}
#start{position:fixed;left:6px;bottom:calc(var(--bar) + 6px);width:320px;max-height:72vh;background:var(--panel);border:1px solid #3a3f4b;border-radius:8px;display:none;flex-direction:column;z-index:100000;box-shadow:0 6px 20px rgba(0,0,0,.5)}
#start.open{display:flex}
#start input{margin:8px;padding:9px 10px;background:var(--panel2);border:1px solid #3a3f4b;border-radius:6px}
#slist{overflow:auto;padding:0 6px 8px;display:flex;flex-direction:column}
.mi{background:none;border:0;text-align:left;display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:6px;cursor:pointer}
.mi .g{font-size:20px;height:26px;width:28px;line-height:26px}
.mi .g img{width:24px;height:24px}
.mi:hover,.mi:focus{background:rgba(255,255,255,.1)}
#slist hr{border:0;border-top:1px solid #3a3f4b;margin:6px 4px}
#ctx{position:fixed;display:none;background:var(--panel);border:1px solid #3a3f4b;border-radius:6px;padding:4px;z-index:100001;min-width:190px}
#ctx.open{display:block}
#ctx .mi{width:100%}
#toast{position:fixed;left:50%;bottom:60px;transform:translateX(-50%);background:var(--panel2);padding:8px 16px;border-radius:6px;display:none;z-index:100002}
/* settings */
.tabs{display:flex;background:var(--panel2);flex:none}
.tab{background:none;border:0;padding:9px 18px;cursor:pointer}
.tab.on{box-shadow:inset 0 -2px var(--accent)}
.pane{padding:14px;overflow:auto;flex:1}
.pane h4{margin:14px 0 8px;font-weight:600;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.pane h4:first-child{margin-top:0}
.sw{display:flex;flex-wrap:wrap;gap:8px}
.swb{width:64px;height:40px;border-radius:6px;border:2px solid transparent;cursor:pointer}
.swb:hover{border-color:var(--accent)}
.in{padding:7px 9px;background:var(--panel2);border:1px solid #3a3f4b;border-radius:6px;min-width:0}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.row .in{flex:1}
.btn{padding:7px 12px;background:var(--panel2);border:1px solid #3a3f4b;border-radius:6px;cursor:pointer}
.btn:hover{border-color:var(--accent)}
.hint{margin-top:10px;font-size:12px;color:var(--muted);line-height:1.5}
.lst{display:flex;flex-direction:column;gap:4px;margin-bottom:6px}
.li{display:flex;align-items:center;gap:8px;padding:4px 6px;background:var(--panel2);border-radius:6px}
.li b{font-weight:600}
.li i{flex:1;font-style:normal;color:var(--muted);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .btn{padding:3px 8px;font-size:12px}
.notes{flex:1;width:100%;border:0;resize:none;background:var(--panel);padding:12px;outline:0}
input[type=color]{width:60px;height:34px;padding:2px;background:var(--panel2);border:1px solid #3a3f4b;border-radius:6px}
</style>
</head>
<body>
<div id="wall"></div>
<div id="desk"></div>
<div id="wins"></div>
<div id="start"><input id="sin" placeholder="Buscar apps…" autocomplete="off"><div id="slist"></div></div>
<div id="ctx"></div>
<div id="toast"></div>
<div id="bar">
  <button id="startbtn" title="Menu (tecla Windows / Ctrl+Espaço)">◆</button>
  <div id="tasks"></div>
  <div id="clock" title="Clique para tela cheia"></div>
</div>

<script>
(()=>{
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){const v=a[k];if(k==='class')e.className=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else if(k==='style')e.style.cssText=v;else if(k.includes('-'))e.setAttribute(k,v);else e[k]=v}for(const x of c.flat())if(x!=null)e.append(x.nodeType?x:document.createTextNode(x));return e};
const toast=(m)=>{const t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2600)};

/* ---------- estado ---------- */
const PRE=[
 'linear-gradient(135deg,#0f2027,#203a43,#2c5364)',
 'linear-gradient(135deg,#232526,#414345)',
 'linear-gradient(135deg,#1a1a2e,#16213e,#0f3460)',
 'linear-gradient(135deg,#2b1055,#7597de)',
 'linear-gradient(135deg,#0b0b0f,#1c1c24)',
 'linear-gradient(135deg,#134e5e,#71b280)',
 'linear-gradient(135deg,#3a1c71,#d76d77,#ffaf7b)',
 'linear-gradient(135deg,#141e30,#243b55)'
];
const DEF={
 apps:[
  {id:'yt',name:'YouTube',icon:'▶️',type:'android',target:'com.google.android.youtube.tv'},
  {id:'nf',name:'Netflix',icon:'🎬',type:'android',target:'com.netflix.ninja'},
  {id:'pv',name:'Prime Video',icon:'📺',type:'android',target:'com.amazon.amazonvideo.livingroom'},
  {id:'sp',name:'Spotify',icon:'🎵',type:'android',target:'com.spotify.tv.android'},
  {id:'kd',name:'Kodi',icon:'🧩',type:'android',target:'org.xbmc.kodi'},
  {id:'wk',name:'Wikipédia',icon:'📖',type:'web',target:'https://pt.wikipedia.org'},
  {id:'nt',name:'Notas',icon:'📝',type:'builtin',target:'notes'},
  {id:'st',name:'Configurações',icon:'⚙️',type:'builtin',target:'settings'}
 ],
 wall:{k:'preset',v:0},accent:'#4f8cff',notes:''
};
let S;
try{S={...DEF,...JSON.parse(localStorage.getItem('tvl1')||'{}')}}catch(e){S={...DEF}}
const save=()=>{try{localStorage.setItem('tvl1',JSON.stringify(S))}catch(e){toast('Sem espaço para salvar (imagem muito grande?)')}};

/* ---------- plano de fundo ---------- */
function applyWall(){
  const w=S.wall,el=$('#wall');
  if(w.k==='preset')el.style.background=PRE[w.v%PRE.length];
  else if(w.k==='color')el.style.background=w.v;
  else el.style.background='#111 center/cover no-repeat url("'+String(w.v).replace(/"/g,'%22')+'")';
  document.documentElement.style.setProperty('--accent',S.accent);
}
function setWall(k,v){S.wall={k,v};applyWall();save()}
function nextWall(){const i=S.wall.k==='preset'?S.wall.v+1:0;setWall('preset',i%PRE.length)}

/* ---------- ícones / apps ---------- */
const glyph=i=>/^(https?:|data:)/.test(i||'')?h('img',{src:i,alt:''}):(i||'📦');
function renderDesk(){
  $('#desk').replaceChildren(...S.apps.map(a=>h('button',{class:'ico',title:a.name,onclick:()=>launch(a),oncontextmenu:e=>{e.preventDefault();e.stopPropagation();popup([{l:'Abrir',f:()=>launch(a)},{l:'Editar…',f:()=>openBuiltin('settings')}],e.clientX,e.clientY)}},h('div',{class:'g'},glyph(a.icon)),h('span',{class:'n'},a.name))));
}
function launch(a){
  closeStart();
  if(a.type==='builtin')return openBuiltin(a.target);
  if(a.type==='android'){location.href='intent:#Intent;action=android.intent.action.MAIN;category=android.intent.category.LAUNCHER;package='+a.target+';end';return}
  if(a.type==='link'){window.open(a.target,'_blank')||(location.href=a.target);return}
  const f=h('iframe',{src:a.target,allow:'autoplay; fullscreen; encrypted-media',referrerPolicy:'no-referrer'});
  openWin({key:'app-'+a.id,title:a.name,icon:a.icon,content:()=>[f,h('div',{class:'wt'},
    h('button',{title:'Recarregar',onclick:()=>{f.src=f.src}},'↻'),
    h('span',{class:'u',title:'Se a janela ficar em branco, o site bloqueia ser aberto aqui. Use ↗.'},a.target),
    h('button',{title:'Abrir em nova aba',onclick:()=>window.open(a.target,'_blank')},'↗'))]});
}
function openBuiltin(n){
  if(n==='settings')openWin({key:'settings',title:'Configurações',icon:'⚙️',w:660,h:480,content:settingsView});
  if(n==='notes')openWin({key:'notes',title:'Notas',icon:'📝',w:460,h:340,content:notesView});
}

/* ---------- janelas ---------- */
const wins=new Map();let zc=10,cascade=0,active=null;
function drag(handle,start,move){
  handle.addEventListener('pointerdown',e=>{
    if(e.button>0||e.target.closest('button'))return;
    if(start(e)===false)return;
    handle.setPointerCapture(e.pointerId);document.body.classList.add('drag');
    const sx=e.clientX,sy=e.clientY;
    const mv=ev=>move(ev.clientX-sx,ev.clientY-sy);
    const up=()=>{handle.removeEventListener('pointermove',mv);handle.removeEventListener('pointerup',up);handle.removeEventListener('pointercancel',up);document.body.classList.remove('drag')};
    handle.addEventListener('pointermove',mv);handle.addEventListener('pointerup',up);handle.addEventListener('pointercancel',up);
    e.preventDefault();
  });
}
function openWin(o){
  if(wins.has(o.key)){const w=wins.get(o.key);if(w.min)restore(w);focusWin(w);return w}
  const vw=innerWidth,vh=innerHeight-44;
  const W=Math.min(o.w||Math.round(vw*.7),vw),H=Math.min(o.h||Math.round(vh*.72),vh);
  const off=(cascade++%6)*28-56;
  const x=Math.max(0,Math.round((vw-W)/2)+off),y=Math.max(0,Math.round((vh-H)/2)+off);
  const w={key:o.key,min:false};
  const body=h('div',{class:'bd'});
  const tb=h('div',{class:'tb'},
    h('span',{class:'ti'},glyph(o.icon)),h('span',{class:'tt'},o.title),
    h('button',{title:'Minimizar (Alt+M)',onclick:()=>minimize(w)},'–'),
    h('button',{title:'Maximizar (Alt+Enter)',onclick:()=>toggleMax(w)},'▢'),
    h('button',{class:'x',title:'Fechar (Alt+Q)',onclick:()=>closeWin(w)},'✕'));
  const rz=h('div',{class:'rz'});
  w.el=h('div',{class:'win',tabIndex:-1,style:`left:${x}px;top:${y}px;width:${W}px;height:${H}px`},tb,body,rz);
  w.btn=h('button',{title:o.title,onclick:()=>{if(w.min){restore(w);focusWin(w)}else if(active===w)minimize(w);else focusWin(w)}},h('span',{},glyph(o.icon)),h('span',{class:'tt2'},o.title));
  const c=o.content();body.append(...[].concat(c));
  w.el.addEventListener('pointerdown',()=>focusWin(w),true);
  tb.addEventListener('dblclick',e=>{if(!e.target.closest('button'))toggleMax(w)});
  let r;
  drag(tb,()=>{if(w.el.classList.contains('max'))return false;r=w.el.getBoundingClientRect()},(dx,dy)=>{
    w.el.style.left=Math.min(Math.max(-W+80,r.left+dx),innerWidth-80)+'px';
    w.el.style.top=Math.min(Math.max(0,r.top+dy),innerHeight-44-34)+'px'});
  drag(rz,()=>{if(w.el.classList.contains('max'))return false;r=w.el.getBoundingClientRect()},(dx,dy)=>{
    w.el.style.width=Math.max(260,r.width+dx)+'px';w.el.style.height=Math.max(160,r.height+dy)+'px'});
  $('#wins').append(w.el);$('#tasks').append(w.btn);wins.set(o.key,w);
  if(innerWidth<760)w.el.classList.add('max');
  focusWin(w);return w;
}
function focusWin(w){
  closeStart();zc++;w.el.style.zIndex=zc;active=w;
  wins.forEach(x=>{x.el.classList.toggle('act',x===w);x.btn.classList.toggle('on',x===w)});
}
function minimize(w){
  w.min=true;w.el.classList.add('hide');w.btn.classList.remove('on');w.btn.classList.add('min');
  if(active===w){active=null;wins.forEach(x=>x.el.classList.remove('act'));
    const v=[...wins.values()].filter(x=>!x.min).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];if(v)focusWin(v)}
}
function restore(w){w.min=false;w.el.classList.remove('hide');w.btn.classList.remove('min')}
function toggleMax(w){w.el.classList.toggle('max')}
function closeWin(w){
  w.el.remove();w.btn.remove();wins.delete(w.key);
  if(active===w){active=null;const v=[...wins.values()].filter(x=>!x.min).sort((a,b)=>b.el.style.zIndex-a.el.style.zIndex)[0];if(v)focusWin(v)}
}
function cycle(d){
  const l=[...wins.values()];if(!l.length)return;
  const w=l[(l.indexOf(active)+d+l.length)%l.length];
  if(w.min)restore(w);focusWin(w);
}

/* ---------- menu iniciar / contexto ---------- */
const start=$('#start'),sin=$('#sin'),slist=$('#slist'),ctx=$('#ctx');
const fs=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen();
function renderStart(){
  const q=sin.value.trim().toLowerCase();
  const items=[...S.apps.map(a=>({l:a.name,i:a.icon,f:()=>launch(a)})),{sep:1}];
  if(!S.apps.some(a=>a.target==='settings'))items.push({l:'Configurações',i:'⚙️',f:()=>openBuiltin('settings')});
  items.push({l:'Tela cheia',i:'⛶',f:fs},{l:'Recarregar launcher',i:'⟳',f:()=>location.reload()});
  slist.replaceChildren(...items.filter(x=>x.sep?!q:(!q||x.l.toLowerCase().includes(q))).map(x=>x.sep?h('hr'):h('button',{class:'mi',onclick:()=>{closeStart();x.f()}},h('span',{class:'g'},glyph(x.i)),x.l)));
}
function toggleStart(){if(start.classList.contains('open'))closeStart();else{ctx.classList.remove('open');start.classList.add('open');sin.value='';renderStart();sin.focus()}}
function closeStart(){start.classList.remove('open')}
sin.addEventListener('input',renderStart);
sin.addEventListener('keydown',e=>{
  if(e.key==='Enter'){const m=$('.mi',slist);if(m)m.click()}
  if(e.key==='ArrowDown'){e.preventDefault();const m=$('.mi',slist);if(m)m.focus()}
});
start.addEventListener('keydown',e=>{
  const l=$$('.mi',slist),i=l.indexOf(document.activeElement);if(i<0)return;
  if(e.key==='ArrowDown'){e.preventDefault();(l[i+1]||l[0]).focus()}
  if(e.key==='ArrowUp'){e.preventDefault();i===0?sin.focus():l[i-1].focus()}
});
$('#startbtn').addEventListener('click',toggleStart);
function popup(items,x,y){
  closeStart();
  ctx.replaceChildren(...items.map(it=>h('button',{class:'mi',onclick:()=>{ctx.classList.remove('open');it.f()}},it.l)));
  ctx.classList.add('open');
  ctx.style.left=Math.min(x,innerWidth-ctx.offsetWidth-4)+'px';
  ctx.style.top=Math.min(y,innerHeight-ctx.offsetHeight-50)+'px';
}
$('#desk').addEventListener('contextmenu',e=>{e.preventDefault();popup([
  {l:'Mudar plano de fundo…',f:()=>openBuiltin('settings')},
  {l:'Próximo fundo (Alt+B)',f:nextWall},
  {l:'Tela cheia',f:fs},
  {l:'Recarregar',f:()=>location.reload()}],e.clientX,e.clientY)});
document.addEventListener('pointerdown',e=>{
  if(!e.target.closest('#start,#startbtn'))closeStart();
  if(!e.target.closest('#ctx'))ctx.classList.remove('open');
},true);

/* ---------- teclado ---------- */
function navIcons(e){
  const items=$$('.ico'),cur=document.activeElement&&document.activeElement.closest&&document.activeElement.closest('.ico');
  if(!items.length)return;e.preventDefault();
  if(!cur){items[0].focus();return}
  const c=cur.getBoundingClientRect(),cx=c.left+c.width/2,cy=c.top+c.height/2;let best=null,bs=1e9;
  for(const it of items){if(it===cur)continue;
    const r=it.getBoundingClientRect(),dx=r.left+r.width/2-cx,dy=r.top+r.height/2-cy;let p,q;
    if(e.key==='ArrowRight'){if(dx<8)continue;p=dx;q=Math.abs(dy)}
    else if(e.key==='ArrowLeft'){if(dx>-8)continue;p=-dx;q=Math.abs(dy)}
    else if(e.key==='ArrowDown'){if(dy<8)continue;p=dy;q=Math.abs(dx)}
    else{if(dy>-8)continue;p=-dy;q=Math.abs(dx)}
    const s=p+q*3;if(s<bs){bs=s;best=it}}
  if(best)best.focus();
}
addEventListener('keydown',e=>{
  const t=e.target,typing=/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName);
  if(e.key==='Meta'||(e.ctrlKey&&e.code==='Space')){e.preventDefault();toggleStart();return}
  if(e.key==='Escape'){if(start.classList.contains('open'))closeStart();else ctx.classList.remove('open');return}
  if(e.altKey){
    const k=e.key.toLowerCase();
    if(k==='tab'){e.preventDefault();cycle(e.shiftKey?-1:1)}
    else if((k==='q'||k==='f4')&&active){e.preventDefault();closeWin(active)}
    else if(k==='m'&&active){e.preventDefault();minimize(active)}
    else if(k==='enter'&&active){e.preventDefault();toggleMax(active)}
    else if(k==='b'){e.preventDefault();nextWall()}
    return;
  }
  if(typing||start.classList.contains('open'))return;
  if(/^Arrow/.test(e.key)&&!t.closest('.win'))navIcons(e);
});

/* ---------- janelas internas ---------- */
function notesView(){
  const t=h('textarea',{class:'notes',placeholder:'Escreva aqui…',value:S.notes||'',spellcheck:false});
  let tm;t.addEventListener('input',()=>{clearTimeout(tm);tm=setTimeout(()=>{S.notes=t.value;save()},400)});
  return t;
}
function settingsView(){
  const tabs=h('div',{class:'tabs'}),pane=h('div',{class:'pane'});
  const T={'Fundo':wallPane,'Apps':appsPane,'Geral':generalPane};
  Object.keys(T).forEach(k=>{const b=h('button',{class:'tab',onclick:()=>{$$('.tab',tabs).forEach(c=>c.classList.remove('on'));b.classList.add('on');pane.replaceChildren(T[k]())}},k);tabs.append(b)});
  tabs.firstChild.click();
  return [tabs,pane];
}
function wallPane(){
  const sw=h('div',{class:'sw'});
  PRE.forEach((g,i)=>sw.append(h('button',{class:'swb',title:'Fundo '+(i+1),style:'background:'+g,onclick:()=>setWall('preset',i)})));
  const url=h('input',{class:'in',type:'text',placeholder:'https://…/imagem.jpg'});
  const file=h('input',{type:'file',accept:'image/*',onchange:e=>{
    const f=e.target.files[0];if(!f)return;
    const img=new Image(),u=URL.createObjectURL(f);
    img.onload=()=>{const m=Math.min(1,1920/img.width),c=document.createElement('canvas');
      c.width=Math.round(img.width*m);c.height=Math.round(img.height*m);
      c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);
      setWall('data',c.toDataURL('image/jpeg',.8));toast('Plano de fundo atualizado')};
    img.onerror=()=>toast('Não consegui abrir essa imagem');
    img.src=u}});
  return h('div',{},
    h('h4',{},'Predefinidos'),sw,
    h('h4',{},'Cor sólida'),h('input',{type:'color',value:'#1b1d23',oninput:e=>setWall('color',e.target.value)}),
    h('h4',{},'Imagem por link'),h('div',{class:'row'},url,h('button',{class:'btn',onclick:()=>{if(url.value.trim())setWall('url',url.value.trim())}},'Aplicar')),
    h('h4',{},'Imagem do dispositivo'),file,
    h('p',{class:'hint'},'Atalho: Alt+B troca para o próximo fundo predefinido.'));
}
function appsPane(){
  let ed=null;
  const nm=h('input',{class:'in',placeholder:'Nome'});
  const ic=h('input',{class:'in',placeholder:'Ícone (emoji ou link)',style:'max-width:150px'});
  const ty=h('select',{class:'in'},...[['android','App Android (pacote)'],['web','Site em janela'],['link','Site em nova aba']].map(([v,t])=>h('option',{value:v},t)));
  const tg=h('input',{class:'in',placeholder:'com.netflix.ninja  ou  https://…'});
  const list=h('div',{class:'lst'});
  const clear=()=>{ed=null;nm.value=ic.value=tg.value='';ty.value='android';sv.textContent='Adicionar'};
  const commit=()=>{save();renderDesk();draw()};
  const draw=()=>list.replaceChildren(...S.apps.map(a=>h('div',{class:'li'},
    h('span',{class:'g',style:'font-size:18px;height:24px;width:26px;line-height:24px'},glyph(a.icon)),h('b',{},a.name),h('i',{},a.type+' · '+a.target),
    a.type==='builtin'?null:h('button',{class:'btn',onclick:()=>{ed=a.id;nm.value=a.name;ic.value=a.icon;ty.value=a.type;tg.value=a.target;sv.textContent='Salvar'}},'Editar'),
    h('button',{class:'btn',onclick:()=>{S.apps=S.apps.filter(x=>x.id!==a.id);commit()}},'Remover'))));
  const sv=h('button',{class:'btn',onclick:()=>{
    if(!nm.value.trim()||!tg.value.trim()){toast('Preencha nome e destino');return}
    const d={name:nm.value.trim(),icon:ic.value.trim()||'📦',type:ty.value,target:tg.value.trim()};
    if(ed){Object.assign(S.apps.find(x=>x.id===ed),d)}else S.apps.push({id:Date.now().toString(36),...d});
    clear();commit()}},'Adicionar');
  draw();
  return h('div',{},h('h4',{},'Apps na tela'),list,h('h4',{},'Adicionar / editar'),
    h('div',{class:'row'},nm,ic),h('div',{class:'row'},ty,tg),h('div',{class:'row'},sv),
    h('p',{class:'hint'},'Android: use o nome do pacote (ex.: com.netflix.ninja). Site em janela: alguns sites bloqueiam ser abertos dentro de janelas; nesse caso use "nova aba".'));
}
function generalPane(){
  return h('div',{},
    h('h4',{},'Cor de destaque'),h('input',{type:'color',value:S.accent,oninput:e=>{S.accent=e.target.value;applyWall();save()}}),
    h('h4',{},'Tela'),h('div',{class:'row'},h('button',{class:'btn',onclick:fs},'Alternar tela cheia')),
    h('h4',{},'Dados'),h('div',{class:'row'},h('button',{class:'btn',onclick:()=>{if(confirm('Restaurar tudo ao padrão?')){localStorage.removeItem('tvl1');location.reload()}}},'Restaurar padrão')),
    h('h4',{},'Atalhos'),
    h('p',{class:'hint'},'Setas: navegar nos ícones · Enter: abrir · Tecla Windows ou Ctrl+Espaço: menu (digite para buscar) · Alt+Tab: trocar janela · Alt+Q: fechar · Alt+M: minimizar · Alt+Enter: maximizar · Alt+B: próximo fundo · Clique direito na área de trabalho: opções.'));
}

/* ---------- relógio e início ---------- */
function tick(){const d=new Date();$('#clock').textContent=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});$('#clock').title=d.toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long'})+' · clique para tela cheia'}
$('#clock').addEventListener('click',fs);
setInterval(tick,20000);tick();
applyWall();renderDesk();
setTimeout(()=>{const i=$('.ico');if(i)i.focus()},50);
})();
</script>
