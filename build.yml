name: Build APK

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Organizar arquivos
        run: |
          mkdir -p src/main/java/com/tvlauncher src/main/assets
          mv AndroidManifest.xml src/main/
          mv MainActivity.java src/main/java/com/tvlauncher/
          mv index.html src/main/assets/

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Compilar
        run: gradle assembleDebug --no-daemon

      - name: Renomear APK
        run: cp build/outputs/apk/debug/*.apk TVLauncher.apk

      - name: Publicar APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk
          name: TV Launcher (APK)
          files: TVLauncher.apk
